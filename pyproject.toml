[project]
name = "construction-spec-assistant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "docling>=1.0.0",
    "docling-core>=1.0.0",
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "notebook>=6.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pip>=25.2",
    "plotly>=5.0.0",
    "pymupdf>=1.23.0",
]

[dependency-groups]
dev = [
    "pdfminer-six>=20250506",
    "pikepdf>=9.11.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
]
