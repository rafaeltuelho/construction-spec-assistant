[project]
name = "construction-spec-assistant"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "docling>=2.0.0",
    "docling-core>=2.0.0",
    "easyocr>=1.7.2",
    "fastembed>=0.7.3",
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "langchain-community>=0.4",
    "langchain-openai>=1.0.0",
    "langchain-qdrant>=1.0.0",
    "langgraph>=1.0.0",
    "langsmith>=0.4.37",
    "matplotlib>=3.7.0",
    "notebook>=6.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pint>=0.25",
    "pip>=25.2",
    "plotly>=5.0.0",
    "pymupdf>=1.23.0",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pdfminer-six>=20250506",
    "pikepdf>=9.11.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
]
