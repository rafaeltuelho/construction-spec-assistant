[project]
name = "construction-spec-assistant"
version = "0.1.0"
description = "AI-powered assistant for reviewing construction specifications and submittals"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # FastAPI and server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Pydantic for data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database clients
    "motor>=3.6.0",  # Async MongoDB client
    "qdrant-client>=1.12.0",

    # LangChain and LLM
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-experimental>=0.3.4",
    "langchain-qdrant>=0.2.0",
    "langchain-cohere==0.4.4",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "cohere>=5.12.0,<5.13.0",

    # Document processing
    "docling>=2.7.0",
    "docling-core>=2.5.0",
    "easyocr>=1.7.0",
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",

    # Embeddings and retrieval
    "fastembed>=0.4.0",
    "rank-bm25>=0.2.2",

    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Unit normalization
    "pint>=0.24.0",

    # Token counting
    "tiktoken>=0.8.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "nest-asyncio>=1.5.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.14.1",
    "json-repair>=0.52.3",

    # Development and notebook (for experimentation)
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
    "notebook>=6.5.0",
    "matplotlib>=3.7.0",
    "plotly>=5.0.0",

    # Evaluation (for experimentation)
    "ragas>=0.3.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",  # For testing FastAPI

    # Code quality
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",

    # Additional dev tools
    "pdfminer-six>=20250506",
    "pikepdf>=9.11.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
